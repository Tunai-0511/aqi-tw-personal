# AgentAQI Streamlit defaults — tuned for end-user "double-click to run"

[server]
port = 8501
headless = false          # open the browser automatically
runOnSave = false         # don't reload mid-use if a file changes on disk
fileWatcherType = "none"  # cheaper: avoids file polling overhead

[browser]
gatherUsageStats = false  # opt out of Streamlit telemetry

[theme]
base = "dark"             # fallback before our custom CSS loads

[client]
# toolbarMode = "auto"   ← 預設,Deploy / Share / 漢堡選單(Rerun/Print/Settings/Clear cache)全部顯示
# 過去設成 "minimal" 導致整個右上角空白(連 Deploy 都被藏掉),使用者問
# 「為什麼這個專案沒 Deploy 按鈕」就是這個原因。"minimal" 是給嵌入式 / viewer-only
# 情境用的,本地開發應該用 "auto"。screencast 按鈕由 styles.py 用 CSS 精準藏掉,
# 不靠 toolbarMode 來控制。
toolbarMode = "auto"
showSidebarNavigation = true
