name: 更新空品資料

# 每小時自動抓一次資料,寫成 JSON 後 commit 回 repo。
# 重點:排程跑在 GitHub 的伺服器上,跟「有沒有人開網頁」「你電腦開不開機」完全無關 ——
# 這就是 Streamlit 做不到的 24 小時更新。
on:
  schedule:
    # 每小時的第 10 分鐘跑(對齊環境部整點後資料上架的緩衝)。
    # 註:GitHub 排程不保證分秒準時,忙時可能延遲幾分鐘,對每小時更新無妨。
    - cron: "10 * * * *"
  workflow_dispatch: {}   # 也可在 Actions 頁面手動按一下,用來測試

# 同一時間只跑一個,避免兩次排程撞在一起搶著 push。
concurrency:
  group: aqi-data
  cancel-in-progress: false

permissions:
  contents: write   # 要能把更新後的 JSON commit 回 repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝相依(只裝抓資料要的,不裝 streamlit/plotly)
        run: pip install -r requirements-fetch.txt

      - name: 抓資料、產生 JSON
        env:
          EPA_KEY: ${{ secrets.EPA_KEY }}
          # 下面是選配:有設這些 secret 才會烤一段全國分析文字進 JSON;沒設就純資料。
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_KEY: ${{ secrets.LLM_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: python scripts/fetch_headless.py

      - name: Commit 更新後的資料
        run: |
          git config user.name "aqi-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          git add docs/data/latest_aqi.json docs/data/history.json agent_export/latest_aqi.json
          if git diff --staged --quiet; then
            echo "資料沒變化(可能 EPA 這輪還沒更新),不 commit。"
          else
            git commit -m "data: 每小時更新 $(date -u +%FT%TZ) [skip ci]"
            git push
          fi
